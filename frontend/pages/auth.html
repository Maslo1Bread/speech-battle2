<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Speech-Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="sb-nav">
    <div class="sb-nav__inner">
      <a class="sb-nav__brand" href="auth.html">
        <img src="assets/media/logo.png" alt="">
        Speech-Battle
      </a>
    </div>
  </nav>

  <main class="sb-page sb-page--narrow">
    <section class="sb-surface auth-card">
      <h1 class="sb-heading sb-heading--md">Вход</h1>
      <p class="auth-card__hint">Войдите, чтобы открыть арену переговоров</p>
      <form id="login-form" class="auth-form">
        <label class="sb-field">
          <span>Логин или почта</span>
          <input class="sb-input" name="login" required autocomplete="username">
        </label>
        <label class="sb-field">
          <span>Пароль</span>
          <input class="sb-input" type="password" name="password" required autocomplete="current-password">
        </label>
        <p class="form-error" id="login-error" hidden></p>
        <button class="sb-btn sb-btn--primary auth-form__submit" type="submit">Войти</button>
      </form>
      <p class="auth-card__footer">
        Нет аккаунта? <a href="registration.html">Зарегистрироваться</a>
      </p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
