<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи — Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/auth-gate.js" data-sb-gate="admin"></script>
</head>
<body>
  <nav class="sb-nav">
    <div class="sb-nav__inner">
      <a class="sb-nav__brand" href="admin.html">
        <img src="assets/media/logo.png" alt="">
        Speech-Battle Admin
      </a>
      <button class="sb-nav__toggle" type="button" id="nav-toggle">☰</button>
      <ul class="sb-nav__links" id="nav-links">
        <li><a class="sb-nav__link" href="admin.html">Переговоры на проверку</a></li>
        <li><a class="sb-nav__link sb-nav__link--active" href="admin-users.html">Администрирование пользователей</a></li>
        <li><a class="sb-nav__link" href="admin-profile.html">Профиль</a></li>
        <li><button class="sb-nav__link sb-nav__link--btn" type="button" id="logout-btn">Выйти</button></li>
      </ul>
    </div>
  </nav>

  <main class="sb-page">
    <section class="sb-surface admin-users" id="users-panel">
      <header class="scenarios__header">
        <h1 class="scenarios__title">Пользователи</h1>
        <p class="scenarios__hint">Поиск по почте или логину</p>
      </header>
      <form class="auth-form admin-create-user" id="create-user-form">
        <h2 class="admin-create-user__title">Создать аккаунт</h2>
        <div class="admin-create-user__grid">
          <label class="sb-field"><span>Имя</span><input class="sb-input" name="full_name" required minlength="2"></label>
          <label class="sb-field"><span>Юзернейм</span><input class="sb-input" name="username" required minlength="3" autocomplete="off"></label>
          <label class="sb-field"><span>Почта</span><input class="sb-input" type="email" name="email" required autocomplete="off"></label>
          <label class="sb-field"><span>Возраст</span><input class="sb-input" type="number" name="age" required min="14" max="100"></label>
          <label class="sb-field"><span>Пароль</span><input class="sb-input" type="password" name="password" required minlength="6" autocomplete="new-password"></label>
        </div>
        <label class="sb-check">
          <input type="checkbox" name="is_admin">
          <span>Сделать администратором</span>
        </label>
        <p class="form-error" id="create-user-error" hidden></p>
        <p class="form-ok" id="create-user-ok" hidden>Аккаунт создан</p>
        <button class="sb-btn sb-btn--primary" type="submit">Создать аккаунт</button>
      </form>
      <div class="admin-search">
        <input class="sb-input" id="user-search" placeholder="Начните вводить логин или почту…">
      </div>
      <ul class="history-list" id="users-list"></ul>
    </section>

    <section class="admin-user-detail" id="user-detail" hidden></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-users.js"></script>
</body>
</html>
