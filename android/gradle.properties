# ── JVM heap — выделяем память, но не переусердствуем ─────────────────
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m \
  -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8

# ── Gradle daemon + параллельная сборка ───────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ── Android ───────────────────────────────────────────────────────────
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# ── Ускорение Kotlin compile ──────────────────────────────────────────
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
