<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль админа — Speech-Battle</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/auth-gate.js" data-sb-gate="admin"></script>
</head>
<body>
  <nav class="sb-nav">
    <div class="sb-nav__inner">
      <a class="sb-nav__brand" href="admin.html">
        <img src="assets/media/logo.png" alt="">
        Speech-Battle Admin
      </a>
      <button class="sb-nav__toggle" type="button" id="nav-toggle">☰</button>
      <ul class="sb-nav__links" id="nav-links">
        <li><a class="sb-nav__link" href="admin.html">Переговоры на проверку</a></li>
        <li><a class="sb-nav__link" href="admin-users.html">Администрирование пользователей</a></li>
        <li><a class="sb-nav__link sb-nav__link--active" href="admin-profile.html">Профиль</a></li>
        <li><button class="sb-nav__link sb-nav__link--btn" type="button" id="logout-btn">Выйти</button></li>
      </ul>
    </div>
  </nav>

  <main class="sb-page">
    <section class="sb-surface profile-hero">
      <div class="profile-hero__top">
        <div>
          <p class="profile-kicker">Администратор</p>
          <h1 class="profile-name" id="profile-name">—</h1>
          <p class="profile-status">Статус: <strong id="profile-status">—</strong></p>
        </div>
        <button class="sb-btn sb-btn--icon profile-edit-btn" type="button" id="edit-toggle" title="Редактировать">✎</button>
      </div>
      <div class="profile-grid" id="profile-view">
        <div class="profile-stat"><span class="profile-stat__label">Юзернейм</span><span class="profile-stat__value" id="profile-username">—</span></div>
        <div class="profile-stat"><span class="profile-stat__label">Почта</span><span class="profile-stat__value" id="profile-email">—</span></div>
        <div class="profile-stat"><span class="profile-stat__label">Возраст</span><span class="profile-stat__value" id="profile-age">0</span></div>
      </div>
      <form class="auth-form profile-edit" id="profile-edit" hidden>
        <label class="sb-field"><span>Имя</span><input class="sb-input" name="full_name" required></label>
        <label class="sb-field"><span>Юзернейм</span><input class="sb-input" name="username" required></label>
        <label class="sb-field"><span>Почта</span><input class="sb-input" type="email" name="email" required></label>
        <label class="sb-field"><span>Возраст</span><input class="sb-input" type="number" name="age" min="14" max="100" required></label>
        <label class="sb-field"><span>Новый пароль</span><input class="sb-input" type="password" name="password" minlength="6"></label>
        <p class="form-error" id="profile-error" hidden></p>
        <div class="profile-edit__actions">
          <button class="sb-btn sb-btn--primary" type="submit">Сохранить</button>
          <button class="sb-btn sb-btn--ghost" type="button" id="edit-cancel">Отмена</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-profile.js"></script>
</body>
</html>
