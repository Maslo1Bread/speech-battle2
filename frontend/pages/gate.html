<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech-Battle</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1030; }
  </style>
  <script>
    (function () {
      var token = localStorage.getItem("sb_token");
      var role = localStorage.getItem("sb_role");
      if (!token) {
        location.replace("/auth.html");
        return;
      }
      location.replace(role === "admin" ? "/admin.html" : "/index.html");
    })();
  </script>
</head>
<body></body>
</html>
